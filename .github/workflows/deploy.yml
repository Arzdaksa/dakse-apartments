name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: mkdir _site && cp -r index.html style.css main.js glass.js assets plan tour _site/
      - name: Stamp file links with this commit, so browsers never mix old and new files
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html _site/tour/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
